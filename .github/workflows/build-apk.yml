name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests must pass before we build
        run: pytest -q

      - name: Show toolchain versions
        run: flet --version

      - name: Build APK (64-bit ARM, which covers modern phones)
        run: flet build apk --yes -v --build-version 0.1.0 --build-number ${{ github.run_number }} --arch arm64-v8a

      - name: Collect the APK
        run: |
          mkdir -p release
          find . -name '*.apk' -not -path './.git/*' -not -path './release/*' -exec cp -v {} release/ \;
          ls -la release

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: khapa-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Attach the APK to a GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.apk \
            --title "Khapa $GITHUB_REF_NAME" \
            --notes "Demo build for the FNB App of the Year Hackathon 2026. No login needed. All learners and marks are fictional. Debug-signed unless a release keystore was configured."
