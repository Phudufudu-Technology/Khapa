[project]
name = "khapa"
version = "0.1.0"
description = "Khapa: offline-first school app for South Africa (Flet rebuild for the FNB App of the Year Hackathon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.flet]
# flet build reads src/main.py by default
product = "Khapa"
company = "Khapa"
org = "za.co.khapa"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
